<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Yapper</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
html,body{margin:0;height:100%;background:#141519;color:#ececf1;font:15px/1.5 Inter,ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center}
.box{max-width:420px;padding:24px;text-align:center}h1{margin:0 0 8px;font-size:22px}p{color:#9c9daa;margin:6px 0}
button{margin-top:14px;background:#ff6b4a;color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#ff5a35}small{display:block;margin-top:14px;color:#6e6f7b}
</style></head><body><div class="box">
<h1>Can't reach Yapper</h1><p>Check your internet connection. YapCord will keep trying.</p>
<button onclick="retry()">Try again now</button><small id="s"></small></div>
<script>
const target = new URLSearchParams(location.search).get('u') || 'https://www.yapper.website/';
function retry(){ location.replace(target); }
let n = 8; const s = document.getElementById('s');
setInterval(() => { n--; s.textContent = 'Retrying in ' + n + 's'; if (n <= 0) retry(); }, 1000);
</script></body></html>
