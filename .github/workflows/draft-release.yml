name: Draft tagged release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create a draft release (no assets are uploaded)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists for $TAG_NAME"
            exit 0
          fi
          gh release create "$TAG_NAME" \
            --repo "$GH_REPO" \
            --draft \
            --generate-notes \
            --title "YapCord ${TAG_NAME#v}" \
            --verify-tag
